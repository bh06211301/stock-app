<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的追蹤清單</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #f5f5f7;
  color: #1d1d1f;
}
.app-header {
  background: linear-gradient(135deg, #FF6B35 0%, #E24B4A 100%);
  color: white;
  padding: 20px 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-top {
  display: flex;
  align-items: center;
  margin-bottom: 12px;
}
.back-btn {
  background: rgba(255,255,255,0.2);
  border: none;
  color: white;
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
  margin-right: 12px;
}
.app-header h1 {
  font-size: 22px;
  font-weight: 600;
  flex: 1;
}
.add-btn {
  background: rgba(255,255,255,0.2);
  border: none;
  color: white;
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}
.container {
  padding: 16px;
  max-width: 480px;
  margin: 0 auto;
}
.empty-state {
  text-align: center;
  padding: 80px 20px;
  color: #86868b;
}
.empty-icon {
  font-size: 64px;
  margin-bottom: 16px;
}
.empty-text {
  font-size: 18px;
  font-weight: 500;
  margin-bottom: 8px;
}
.empty-hint {
  font-size: 14px;
  line-height: 1.6;
}
.stock-card {
  background: white;
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  position: relative;
}
.stock-header {
  display: flex;
  align-items: center;
  margin-bottom: 12px;
}
.stock-info {
  flex: 1;
}
.stock-name {
  font-size: 18px;
  font-weight: 700;
}
.stock-code {
  font-size: 14px;
  color: #86868b;
  margin-top: 4px;
}
.delete-btn {
  background: #FF3B30;
  color: white;
  border: none;
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
}
.stock-stats {
  display: flex;
  gap: 12px;
  padding-top: 12px;
  border-top: 1px solid #f5f5f7;
}
.stat-item {
  flex: 1;
}
.stat-label {
  font-size: 12px;
  color: #86868b;
  margin-bottom: 4px;
}
.stat-value {
  font-size: 15px;
  font-weight: 600;
}
.positive { color: #1D9E75; }
.negative { color: #E24B4A; }
.view-btn {
  margin-top: 12px;
  width: 100%;
  padding: 10px;
  background: #378ADD;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}
.modal.show {
  display: flex;
}
.modal-content {
  background: white;
  border-radius: 16px;
  padding: 24px;
  margin: 20px;
  max-width: 320px;
  width: 100%;
}
.modal-title {
  font-size: 20px;
  font-weight: 600;
  margin-bottom: 16px;
  text-align: center;
}
.modal-input {
  width: 100%;
  padding: 12px 16px;
  border: 1px solid #e5e5e7;
  border-radius: 10px;
  font-size: 17px;
  margin-bottom: 16px;
}
.modal-buttons {
  display: flex;
  gap: 12px;
}
.modal-btn {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}
.modal-btn.cancel {
  background: #f5f5f7;
  color: #1d1d1f;
}
.modal-btn.confirm {
  background: #378ADD;
  color: white;
}
.info-banner {
  background: #E3F2FD;
  color: #1976D2;
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 16px;
  font-size: 14px;
  line-height: 1.5;
}
</style>
</head>
<body>
<div class="app-header">
  <div class="header-top">
    <button class="back-btn" onclick="goBack()">← 返回</button>
    <h1>⭐ 我的追蹤清單</h1>
    <button class="add-btn" onclick="showAddModal()">+ 新增</button>
  </div>
</div>

<div class="container">
  <div class="info-banner">
    💡 加入你想追蹤的股票,系統會每週自動更新大戶資料
  </div>

  <div id="emptyState" class="empty-state">
    <div class="empty-icon">📋</div>
    <div class="empty-text">還沒有追蹤的股票</div>
    <div class="empty-hint">
      點擊右上角「+ 新增」按鈕<br>
      加入你想關注的股票代碼
    </div>
  </div>

  <div id="stockList"></div>
</div>

<div id="addModal" class="modal">
  <div class="modal-content">
    <div class="modal-title">新增追蹤股票</div>
    <input type="text" id="stockCodeInput" class="modal-input" 
           placeholder="輸入股票代碼 (例如: 2330)" maxlength="6">
    <div class="modal-buttons">
      <button class="modal-btn cancel" onclick="closeAddModal()">取消</button>
      <button class="modal-btn confirm" onclick="addStock()">確認</button>
    </div>
  </div>
</div>

<script>
function goBack() {
  window.location.href = 'index.html';
}

function getWatchlist() {
  const list = localStorage.getItem('stockWatchlist');
  return list ? JSON.parse(list) : [];
}

function saveWatchlist(list) {
  localStorage.setItem('stockWatchlist', JSON.stringify(list));
}

function showAddModal() {
  document.getElementById('addModal').classList.add('show');
  document.getElementById('stockCodeInput').value = '';
  document.getElementById('stockCodeInput').focus();
}

function closeAddModal() {
  document.getElementById('addModal').classList.remove('show');
}

function addStock() {
  const code = document.getElementById('stockCodeInput').value.trim();
  
  if (!code) {
    alert('請輸入股票代碼');
    return;
  }
  
  // 驗證股票代碼格式
  if (!/^\d{4,6}$/.test(code)) {
    alert('股票代碼格式不正確');
    return;
  }
  
  const watchlist = getWatchlist();
  
  if (watchlist.includes(code)) {
    alert('此股票已在追蹤清單中');
    return;
  }
  
  watchlist.push(code);
  saveWatchlist(watchlist);
  
  closeAddModal();
  loadStocks();
}

function removeStock(code) {
  if (confirm(`確定要移除 ${code} 嗎?`)) {
    let watchlist = getWatchlist();
    watchlist = watchlist.filter(c => c !== code);
    saveWatchlist(watchlist);
    loadStocks();
  }
}

function viewStock(code) {
  window.location.href = `index.html?stock=${code}`;
}

async function loadStocks() {
  const watchlist = getWatchlist();
  const container = document.getElementById('stockList');
  const emptyState = document.getElementById('emptyState');
  
  if (watchlist.length === 0) {
    emptyState.style.display = 'block';
    container.innerHTML = '';
    return;
  }
  
  emptyState.style.display = 'none';
  container.innerHTML = '<div style="text-align:center; padding:20px; color:#86868b;">載入中...</div>';
  
  // 載入排行榜資料
  try {
    const response = await fetch('data/ranking.json');
    const rankingData = await response.json();
    
    const allStocks = rankingData.rankings.all || [];
    
    container.innerHTML = '';
    
    for (const code of watchlist) {
      const stockData = allStocks.find(s => s.stock_code === code);
      
      const card = document.createElement('div');
      card.className = 'stock-card';
      
      if (stockData) {
        const change = stockData.trend.holder_change;
        const ratio = stockData.trend.ratio_change;
        
        card.innerHTML = `
          <div class="stock-header">
            <div class="stock-info">
              <div class="stock-name">${stockData.stock_name}</div>
              <div class="stock-code">${stockData.stock_code}</div>
            </div>
            <button class="delete-btn" onclick="removeStock('${code}')">移除</button>
          </div>
          <div class="stock-stats">
            <div class="stat-item">
              <div class="stat-label">大戶人數</div>
              <div class="stat-value">${stockData.latest.big_holders}</div>
            </div>
            <div class="stat-item">
              <div class="stat-label">持股比例</div>
              <div class="stat-value">${stockData.latest.big_ratio}%</div>
            </div>
            <div class="stat-item">
              <div class="stat-label">近期變化</div>
              <div class="stat-value ${change >= 0 ? 'positive' : 'negative'}">
                ${change >= 0 ? '+' : ''}${change}人
              </div>
            </div>
          </div>
          <button class="view-btn" onclick="viewStock('${code}')">
            查看詳細趨勢 →
          </button>
        `;
      } else {
        // 排行榜沒有此股票資料
        card.innerHTML = `
          <div class="stock-header">
            <div class="stock-info">
              <div class="stock-name">股票 ${code}</div>
              <div class="stock-code">${code}</div>
            </div>
            <button class="delete-btn" onclick="removeStock('${code}')">移除</button>
          </div>
          <div style="padding: 12px 0; text-align: center; color: #86868b; font-size: 14px;">
            ⚠️ 此股票暫無排行榜資料<br>
            <small>可能不在追蹤清單中,或資料尚未更新</small>
          </div>
          <button class="view-btn" onclick="viewStock('${code}')">
            查看個股資料 →
          </button>
        `;
      }
      
      container.appendChild(card);
    }
    
  } catch (error) {
    container.innerHTML = '<div style="text-align:center; padding:20px; color:#E24B4A;">載入失敗,請稍後再試</div>';
  }
}

// Enter鍵新增
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('stockCodeInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
      addStock();
    }
  });
  
  loadStocks();
});

// 點擊modal背景關閉
document.getElementById('addModal').addEventListener('click', (e) => {
  if (e.target.id === 'addModal') {
    closeAddModal();
  }
});
</script>
</body>
</html>
