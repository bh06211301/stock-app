<script>
// Service Worker 註冊，新版本安裝後自動重新載入頁面
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js').then(reg => {
    reg.addEventListener('updatefound', () => {
      const newWorker = reg.installing;
      newWorker.addEventListener('statechange', () => {
        if (newWorker.state === 'activated') {
          window.location.reload();
        }
      });
    });
  }).catch(err => {
    console.log('Service Worker registration failed:', err);
  });
}

// 檢查是否已安裝為APP
const isStandalone = window.matchMedia('(display-mode: standalone)').matches || 
                     window.navigator.standalone || 
                     document.referrer.includes('android-app://');

if (!isStandalone) {
  // 只在Safari iOS上顯示安裝提示
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const isSafari = /Safari/.test(navigator.userAgent) && !/Chrome/.test(navigator.userAgent);
  
  if (isIOS && isSafari) {
    document.getElementById('installPrompt').style.display = 'block';
  }
}

let chartInstances = {};

async function searchStock() {
  const stockCode = document.getElementById('stockCode').value.trim();
  if (!stockCode) {
    showError('請輸入股票代碼');
    return;
  }

  showLoading();
  hideError();

  try {
    // 第一步：讀取預先產生的個股 JSON（快速）
    let data = await fetchFromLocalJSON(stockCode);

    // 第二步：若無預存資料，即時從 Norway 下載歷史資料
    if (!data || !data.success) {
      setLoadingText('即時下載中，約需 5-15 秒...');
      data = await fetchFromNorway(stockCode);
    }

    if (!data || !data.success) {
      hideLoading();
      showError('找不到此股票資料，請確認代碼是否正確（例：2330、0050）');
      return;
    }

    displayData(data);
    hideLoading();

  } catch (error) {
    console.error('Error:', error);
    showError('載入失敗，請稍後再試');
    hideLoading();
  }
}

// 從後端產生的個股 JSON 讀取 (最快、最穩定)
async function fetchFromLocalJSON(stockCode) {
  try {
    const response = await fetch(`data/stocks/${stockCode}.json`, { cache: 'no-cache' });
    if (!response.ok) return null;

    const json = await response.json();
    if (!json || !json.history || json.history.length === 0) return null;

    const latest = json.history[0];
    const prevWeek = json.history.length > 1 ? json.history[1] : null;
    const dist = latest.distribution || [];

    // 格式化日期 20260703 -> 2026-07-03
    const d = latest.date || '';
    const dataDate = d.length === 8
      ? `${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}`
      : d;

    return {
      success: true,
      stockCode: json.stock_code,
      stockName: json.stock_name,
      dataDate,
      bigHolders: latest.big_holders.toLocaleString(),
      bigHolderChange: prevWeek ? latest.big_holders - prevWeek.big_holders : null,
      bigHolderRatio: latest.big_ratio.toFixed(1),
      distributions: dist.map(d => ({
        range: d.level_name,
        holders: d.holders,
        shares: d.shares
      })),
      // 趨勢歷史 (用於圖表二)
      trendHistory: json.history.map(h => ({
        date: h.date,
        big_ratio: h.big_ratio,
        big_holders: h.big_holders,
        close_price: h.close_price ?? null
      })).reverse(),
      signal: json.signal || null
    };
  } catch (err) {
    console.log('Local JSON fetch failed:', err.message);
    return null;
  }
}

// 備援: 即時從 norway.twsthr.info 下載任意股票的歷史資料（含趨勢分析）
async function fetchFromNorway(stockCode) {
  const norUrl = `https://norway.twsthr.info/StockHolders.aspx?stock=${stockCode}`;
  const proxies = [
    'https://corsproxy.io/?',
    'https://api.allorigins.win/raw?url=',
  ];

  for (const proxy of proxies) {
    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 18000);
      const response = await fetch(proxy + encodeURIComponent(norUrl), {
        signal: controller.signal
      });
      clearTimeout(timeoutId);
      if (!response.ok) continue;

      const html = await response.text();
      const result = parseNorwayHtml(html, stockCode);
      if (result && result.success) return result;
    } catch (err) {
      console.log(`Norway proxy ${proxy} failed:`, err.message);
    }
  }
  return null;
}

// 解析 norway.twsthr.info 的股權分散週報 HTML
// 表格結構（16欄）: [2]=日期 [3]=總張數 [4]=總股東人數 [12]=千張人數 [13]=千張%
function parseNorwayHtml(html, stockCode) {
  try {
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, 'text/html');

    // 找股票名稱：頁面中格式為「2330   台積電」
    const nameMatch = html.match(new RegExp(stockCode + '\\s{1,5}([\\u4e00-\\u9fa5A-Za-z\\-·]{2,12})'));
    const stockName = nameMatch ? `${stockCode} ${nameMatch[1]}` : stockCode;

    // 找週報資料表：16 欄且 col[2] 是 8 位日期
    let weeklyTable = null;
    for (const tbl of doc.querySelectorAll('table')) {
      for (const tr of tbl.querySelectorAll('tr')) {
        const cells = tr.querySelectorAll('td, th');
        if (cells.length !== 16) continue;
        const val = cells[2].textContent.trim();
        if (/^\d{8}$/.test(val) && val.startsWith('20')) {
          weeklyTable = tbl;
          break;
        }
      }
      if (weeklyTable) break;
    }

    if (!weeklyTable) return null;

    const history = [];
    for (const tr of weeklyTable.querySelectorAll('tr')) {
      const cells = tr.querySelectorAll('td, th');
      if (cells.length !== 16) continue;

      const date = cells[2].textContent.trim();
      if (!/^\d{8}$/.test(date) || !date.startsWith('20')) continue;

      const totalLots    = norParseInt(cells[3].textContent);
      const totalHolders = norParseInt(cells[4].textContent);
      const bigHolders   = norParseInt(cells[12].textContent);
      const bigRatio     = norParseFloat(cells[13].textContent);
      const closePrice   = norParseFloat(cells[14].textContent);

      if (totalLots === 0 && bigHolders === 0) continue;

      history.push({
        date,
        big_holders: bigHolders,
        big_ratio: bigRatio,
        total_holders: totalHolders,
        total_shares: totalLots * 1000,
        big_shares: Math.round(bigRatio / 100 * totalLots) * 1000,
        close_price: closePrice > 0 ? closePrice : null,
      });
    }

    if (history.length === 0) return null;

    // Norway 資料已是最新在前，限制 52 週
    history.sort((a, b) => b.date.localeCompare(a.date));
    history.splice(52);
    const latest = history[0];

    // 計算趨勢（與 calculate_trends.py 邏輯相同）
    const weeksAgo = Math.min(12, history.length - 1);
    const prev = history[weeksAgo];
    const trend = weeksAgo > 0 ? {
      holder_change: latest.big_holders - prev.big_holders,
      ratio_change: parseFloat((latest.big_ratio - prev.big_ratio).toFixed(2)),
      weeks: weeksAgo,
    } : null;

    const signal = norGenerateSignal(trend);
    const d = latest.date;
    const dataDate = `${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}`;

    return {
      success: true,
      stockCode,
      stockName,
      dataDate,
      bigHolders: latest.big_holders.toLocaleString(),
      bigHolderChange: history.length > 1 ? history[0].big_holders - history[1].big_holders : null,
      bigHolderRatio: latest.big_ratio.toFixed(1),
      distributions: [],
      trendHistory: [...history].reverse().map(h => ({
        date: h.date, big_ratio: h.big_ratio, big_holders: h.big_holders, close_price: h.close_price ?? null
      })),
      signal,
      trend,
    };
  } catch (err) {
    console.error('Norway parse error:', err);
    return null;
  }
}

function norParseInt(s) {
  const n = parseInt(s.replace(/,/g, '').trim(), 10);
  return isNaN(n) ? 0 : n;
}

function norParseFloat(s) {
  const n = parseFloat(s.replace(/,/g, '').trim());
  return isNaN(n) ? 0 : n;
}

function norGenerateSignal(trend) {
  if (!trend) return { icon: '❓', text: '資料不足', level: 'unknown', color: 'gray' };
  const { holder_change: hc, ratio_change: rc } = trend;
  if (hc > 10 && rc > 3)  return { icon: '🚀', text: '大戶快速集中', level: 'strong_buy', color: 'green' };
  if (hc > 5  && rc > 2)  return { icon: '📈', text: '大戶持續增加', level: 'buy',        color: 'green' };
  if (hc > 0  && rc > 0)  return { icon: '➡️', text: '大戶微幅增加', level: 'hold',       color: 'gray'  };
  if (hc < -5 || rc < -2) return { icon: '📉', text: '大戶持股減少', level: 'sell',       color: 'red'   };
  return { icon: '➡️', text: '趨勢不明顯', level: 'neutral', color: 'gray' };
}

function displayData(data) {
  document.getElementById('stockName').textContent = data.stockName;
  document.getElementById('stockCodeDisplay').textContent = data.stockCode;
  document.getElementById('dataDate').textContent = data.dataDate;
  document.getElementById('bigHolderRatio').textContent = data.bigHolderRatio;
  document.getElementById('bigHolders').textContent = data.bigHolders;

  const changeEl = document.getElementById('bigHolderChange');
  if (data.bigHolderChange !== null && data.bigHolderChange !== undefined) {
    const sign = data.bigHolderChange > 0 ? '+' : '';
    changeEl.textContent = `vs 上週 ${sign}${data.bigHolderChange} 人`;
    changeEl.style.color = data.bigHolderChange > 0 ? '#34c759' : data.bigHolderChange < 0 ? '#ff3b30' : '#86868b';
  } else {
    changeEl.textContent = '';
  }

  // 顯示趨勢信號
  if (data.signal) {
    const icon = data.signal.icon || '';
    const text = data.signal.text || '';
    document.getElementById('stockName').textContent = `${data.stockName}  ${icon} ${text}`;
  }

  document.getElementById('results').style.display = 'block';

  drawPercentileIndicator(data.trendHistory);
  drawDualAxisChart(data.trendHistory);
  drawChangeChart(data.trendHistory);

  const hasDist = data.distributions && data.distributions.length > 0;
  document.getElementById('distributionCard').style.display = hasDist ? 'block' : 'none';
  if (hasDist) drawDistributionChart(data.distributions);

  updateWatchlistButton();
}

function drawDistributionChart(distributions) {
  const ctx = document.getElementById('distributionChart');
  
  if (chartInstances.distribution) {
    chartInstances.distribution.destroy();
  }
  
  const labels = distributions.map(d => d.range);
  const holdersData = distributions.map(d => d.holders);
  const sharesData = distributions.map(d => Math.round(d.shares / 1000));
  
  chartInstances.distribution = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [{
        label: '持股人數',
        data: holdersData,
        backgroundColor: 'rgba(55, 138, 221, 0.7)',
        borderColor: 'rgba(55, 138, 221, 1)',
        borderWidth: 1.5,
        yAxisID: 'y'
      }, {
        label: '持股張數(千)',
        data: sharesData,
        backgroundColor: 'rgba(29, 158, 117, 0.7)',
        borderColor: 'rgba(29, 158, 117, 1)',
        borderWidth: 1.5,
        yAxisID: 'y1'
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      aspectRatio: 1.2,
      plugins: {
        legend: {
          display: true,
          position: 'bottom',
          labels: {
            boxWidth: 14,
            font: { size: 12, weight: '500' },
            padding: 12
          }
        }
      },
      scales: {
        x: {
          ticks: {
            font: { size: 10 },
            maxRotation: 45,
            minRotation: 45
          },
          grid: {
            display: false
          }
        },
        y: {
          type: 'linear',
          position: 'left',
          ticks: {
            font: { size: 11 },
            callback: function(value) {
              return value.toLocaleString();
            }
          }
        },
        y1: {
          type: 'linear',
          position: 'right',
          ticks: {
            font: { size: 11 },
            callback: function(value) {
              return value.toLocaleString();
            }
          },
          grid: {
            drawOnChartArea: false
          }
        }
      }
    }
  });
}

// ── 圖表一：雙軸趨勢圖（大戶比例折線 + 大戶人數柱狀）──────────────
function drawDualAxisChart(trendHistory) {
  const ctx = document.getElementById('holdersChart');
  if (chartInstances.holders) chartInstances.holders.destroy();

  if (!trendHistory || trendHistory.length < 2) {
    ctx.getContext('2d').fillText('歷史資料累積中，每週自動更新', 20, 80);
    return;
  }

  const recent = trendHistory.slice(-24);
  const labels = recent.map(h => {
    const d = h.date || '';
    return d.length === 8 ? `${d.slice(4,6)}/${d.slice(6,8)}` : d;
  });

  const hasPriceData = recent.some(h => h.close_price != null && h.close_price > 0);

  const titleEl = document.getElementById('holdersChartTitle');
  if (hasPriceData) titleEl.textContent = '大戶比例 vs 股價';
  else              titleEl.textContent = '大戶比例 & 人數趨勢';

  const datasets = hasPriceData ? [
    {
      type: 'line',
      label: '大戶比例 (%)',
      data: recent.map(h => h.big_ratio),
      borderColor: 'rgba(127, 119, 221, 1)',
      backgroundColor: 'rgba(127, 119, 221, 0.08)',
      fill: true,
      tension: 0.3,
      pointRadius: 2,
      pointHoverRadius: 6,
      borderWidth: 2.5,
      yAxisID: 'yRatio',
      order: 1,
    },
    {
      type: 'line',
      label: '收盤價 (元)',
      data: recent.map(h => h.close_price),
      borderColor: 'rgba(255, 159, 64, 1)',
      backgroundColor: 'rgba(255, 159, 64, 0)',
      tension: 0.3,
      pointRadius: 2,
      pointHoverRadius: 6,
      borderWidth: 2,
      borderDash: [],
      yAxisID: 'yPrice',
      order: 2,
    }
  ] : [
    {
      type: 'line',
      label: '大戶比例 (%)',
      data: recent.map(h => h.big_ratio),
      borderColor: 'rgba(127, 119, 221, 1)',
      backgroundColor: 'rgba(127, 119, 221, 0)',
      tension: 0.3,
      pointRadius: 3,
      pointHoverRadius: 6,
      borderWidth: 2.5,
      yAxisID: 'yRatio',
      order: 1,
    },
    {
      type: 'line',
      label: '大戶人數',
      data: recent.map(h => h.big_holders),
      borderColor: 'rgba(55, 138, 221, 0.9)',
      backgroundColor: 'rgba(55, 138, 221, 0.08)',
      fill: false,
      tension: 0.3,
      pointRadius: 2,
      pointHoverRadius: 6,
      borderWidth: 2,
      yAxisID: 'yHolders',
      order: 2,
    }
  ];

  function dynRange(values, pad = 0.2) {
    const valid = values.filter(v => v != null && isFinite(v));
    if (!valid.length) return {};
    const lo = Math.min(...valid), hi = Math.max(...valid);
    const margin = (hi - lo) * pad || hi * 0.05;
    return { min: lo - margin, max: hi + margin };
  }

  const ratioRange   = dynRange(recent.map(h => h.big_ratio));
  const holdersRange = dynRange(recent.map(h => h.big_holders));
  const priceRange   = dynRange(recent.map(h => h.close_price));

  const scalesConfig = hasPriceData ? {
    x: { ticks: { font: { size: 10 }, maxRotation: 45 }, grid: { display: false } },
    yRatio: {
      type: 'linear', position: 'left',
      ...ratioRange,
      ticks: { font: { size: 11 }, callback: v => v.toFixed(1) + '%' },
      title: { display: false }
    },
    yPrice: {
      type: 'linear', position: 'right',
      ...priceRange,
      ticks: { font: { size: 11 }, callback: v => v.toLocaleString() },
      grid: { drawOnChartArea: false }
    }
  } : {
    x: { ticks: { font: { size: 10 }, maxRotation: 45 }, grid: { display: false } },
    yRatio: {
      type: 'linear', position: 'left',
      ...ratioRange,
      ticks: { font: { size: 11 }, callback: v => v.toFixed(1) + '%' }
    },
    yHolders: {
      type: 'linear', position: 'right',
      ...holdersRange,
      ticks: { font: { size: 11 }, callback: v => v.toLocaleString() },
      grid: { drawOnChartArea: false }
    }
  };

  chartInstances.holders = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      aspectRatio: 1.5,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: {
          display: true,
          position: 'bottom',
          labels: { boxWidth: 14, font: { size: 12 }, padding: 10 }
        },
        tooltip: {
          callbacks: {
            label: c => {
              if (c.dataset.label === '大戶比例 (%)') return `比例: ${c.parsed.y.toFixed(2)}%`;
              if (c.dataset.label === '收盤價 (元)')  return `股價: $${c.parsed.y.toLocaleString()}`;
              return `人數: ${c.parsed.y.toLocaleString()} 人`;
            }
          }
        }
      },
      scales: scalesConfig
    }
  });
}

// ── 圖表二：週變化量柱狀圖（綠漲紅跌）──────────────────────────────
function drawChangeChart(trendHistory) {
  const card = document.getElementById('changeCard');
  const ctx  = document.getElementById('changeChart');
  if (chartInstances.change) chartInstances.change.destroy();

  if (!trendHistory || trendHistory.length < 3) {
    card.style.display = 'none';
    return;
  }
  card.style.display = 'block';

  const src = trendHistory.slice(-25);
  const labels = [], changes = [];
  for (let i = 1; i < src.length; i++) {
    changes.push(src[i].big_holders - src[i - 1].big_holders);
    const d = src[i].date || '';
    labels.push(d.length === 8 ? `${d.slice(4,6)}/${d.slice(6,8)}` : d);
  }

  chartInstances.change = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label: '大戶人數週變化',
        data: changes,
        backgroundColor: changes.map(v => v >= 0 ? 'rgba(52,199,89,0.7)'  : 'rgba(255,59,48,0.7)'),
        borderColor:      changes.map(v => v >= 0 ? 'rgba(52,199,89,1)'   : 'rgba(255,59,48,1)'),
        borderWidth: 1,
        borderRadius: 3,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      aspectRatio: 1.5,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: c => {
              const v = c.parsed.y;
              return `${v >= 0 ? '+' : ''}${v} 人`;
            }
          }
        }
      },
      scales: {
        x: { ticks: { font: { size: 10 }, maxRotation: 45 }, grid: { display: false } },
        y: {
          ticks: { font: { size: 11 }, callback: v => (v >= 0 ? '+' : '') + v },
          grid: {
            color: ctx2 => ctx2.tick.value === 0 ? '#1d1d1f' : 'rgba(0,0,0,0.06)',
            lineWidth: ctx2 => ctx2.tick.value === 0 ? 1.5 : 1,
          }
        }
      }
    }
  });
}

// ── 圖表三：52週籌碼位置指標 ─────────────────────────────────────────
function drawPercentileIndicator(trendHistory) {
  const card = document.getElementById('percentileCard');
  if (!trendHistory || trendHistory.length < 4) {
    card.style.display = 'none';
    return;
  }
  card.style.display = 'block';

  function fillIndicator(ratios, markerEl, minEl, curEl, maxEl, rankEl) {
    const current = ratios[ratios.length - 1];
    const lo      = Math.min(...ratios);
    const hi      = Math.max(...ratios);
    const range   = hi - lo;
    const pct     = range > 0 ? ((current - lo) / range) * 100 : 50;
    const rankPct = Math.round((ratios.filter(r => r <= current).length / ratios.length) * 100);
    document.getElementById(markerEl).style.left = Math.min(98, Math.max(2, pct)) + '%';
    document.getElementById(minEl).textContent   = lo.toFixed(2) + '%';
    document.getElementById(curEl).textContent   = current.toFixed(2) + '%';
    document.getElementById(maxEl).textContent   = hi.toFixed(2) + '%';
    document.getElementById(rankEl).textContent  = rankPct;
  }

  const allRatios = trendHistory.map(h => h.big_ratio);
  fillIndicator(allRatios, 'pctMarker', 'pctMinVal', 'pctCurVal', 'pctMaxVal', 'pctRank');

  const ratios3m = allRatios.slice(-12);
  fillIndicator(ratios3m, 'pct3mMarker', 'pct3mMinVal', 'pct3mCurVal', 'pct3mMaxVal', 'pct3mRank');
}

function showLoading() {
  document.getElementById('loading').style.display = 'block';
  document.getElementById('results').style.display = 'none';
  setLoadingText('載入中...');
}

function setLoadingText(msg) {
  const el = document.getElementById('loadingText');
  if (el) el.textContent = msg;
}

function hideLoading() {
  document.getElementById('loading').style.display = 'none';
}

function showError(message) {
  const errorDiv = document.getElementById('error');
  errorDiv.textContent = message;
  errorDiv.style.display = 'block';
  document.getElementById('results').style.display = 'none';
}

function hideError() {
  document.getElementById('error').style.display = 'none';
}

// 追蹤清單功能
function getWatchlist() {
  const list = localStorage.getItem('stockWatchlist');
  return list ? JSON.parse(list) : [];
}

function saveWatchlist(list) {
  localStorage.setItem('stockWatchlist', JSON.stringify(list));
}

function isInWatchlist(code) {
  return getWatchlist().includes(code);
}

function toggleWatchlist() {
  const code = document.getElementById('stockCode').value.trim();
  if (!code) return;
  
  let watchlist = getWatchlist();
  const btn = document.getElementById('watchlistBtn');
  
  if (isInWatchlist(code)) {
    // 移除
    watchlist = watchlist.filter(c => c !== code);
    saveWatchlist(watchlist);
    btn.textContent = '⭐ 加入追蹤';
    btn.style.background = '#FF6B35';
  } else {
    // 加入
    watchlist.push(code);
    saveWatchlist(watchlist);
    btn.textContent = '✅ 已追蹤';
    btn.style.background = '#1D9E75';
  }
}

function updateWatchlistButton() {
  const code = document.getElementById('stockCode').value.trim();
  const btn = document.getElementById('watchlistBtn');
  
  if (isInWatchlist(code)) {
    btn.textContent = '✅ 已追蹤';
    btn.style.background = '#1D9E75';
  } else {
    btn.textContent = '⭐ 加入追蹤';
    btn.style.background = '#FF6B35';
  }
}

function useMockData() {
  hideLoading();
  showError('載入逾時。請確認網路連線後重試，或等待每週五自動更新後資料將可正常載入。');
}

window.addEventListener('load', () => {
  const params = new URLSearchParams(window.location.search);
  const stockParam = params.get('stock');
  if (stockParam) {
    document.getElementById('stockCode').value = stockParam.trim();
  }
  searchStock();
});

document.getElementById('stockCode').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') {
    searchStock();
  }
});
