<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#378ADD">
<title>大戶集中排行榜</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #f5f5f7;
  color: #1d1d1f;
}
.app-header {
  background: linear-gradient(135deg, #378ADD 0%, #1D5FA5 100%);
  color: white;
  padding: 20px 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-top {
  display: flex;
  align-items: center;
  margin-bottom: 12px;
}
.back-btn {
  background: rgba(255,255,255,0.2);
  border: none;
  color: white;
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
  margin-right: 12px;
}
.app-header h1 {
  font-size: 22px;
  font-weight: 600;
  flex: 1;
}
.update-time {
  font-size: 13px;
  opacity: 0.9;
  text-align: center;
}
.container {
  padding: 16px;
  max-width: 480px;
  margin: 0 auto;
}
.summary-card {
  background: white;
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  display: flex;
  justify-content: space-around;
}
.summary-item {
  text-align: center;
}
.summary-number {
  font-size: 24px;
  font-weight: 700;
  color: #378ADD;
}
.summary-label {
  font-size: 13px;
  color: #86868b;
  margin-top: 4px;
}
.stock-item {
  background: white;
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  cursor: pointer;
  transition: transform 0.2s;
}
.stock-item:active {
  transform: scale(0.98);
}
.stock-header {
  display: flex;
  align-items: center;
  margin-bottom: 12px;
}
.stock-rank {
  font-size: 20px;
  font-weight: 700;
  color: #86868b;
  width: 32px;
}
.stock-signal {
  font-size: 24px;
  margin-right: 8px;
}
.stock-info {
  flex: 1;
}
.stock-name {
  font-size: 18px;
  font-weight: 700;
}
.stock-code {
  font-size: 14px;
  color: #86868b;
}
.stock-stats {
  display: flex;
  gap: 16px;
  padding-top: 12px;
  border-top: 1px solid #f5f5f7;
}
.stat-item {
  flex: 1;
}
.stat-label {
  font-size: 12px;
  color: #86868b;
  margin-bottom: 4px;
}
.stat-value {
  font-size: 16px;
  font-weight: 600;
}
.positive { color: #1D9E75; }
.negative { color: #E24B4A; }
.loading {
  text-align: center;
  padding: 60px 20px;
  color: #86868b;
}
.loading-spinner {
  width: 40px;
  height: 40px;
  margin: 0 auto 16px;
  border: 3px solid #e5e5e7;
  border-top-color: #378ADD;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: #86868b;
}
.empty-icon {
  font-size: 48px;
  margin-bottom: 16px;
}
</style>
</head>
<body>
<div class="app-header">
  <div class="header-top">
    <button class="back-btn" onclick="goBack()">← 返回</button>
    <h1>🔥 大戶集中排行榜</h1>
    <button class="back-btn" onclick="window.location.href='watchlist.html'">⭐ 我的</button>
  </div>
  <div class="update-time" id="updateTime">載入中...</div>
</div>

<div id="loading" class="loading">
  <div class="loading-spinner"></div>
  <div>載入排行榜...</div>
</div>

<div class="container" id="content" style="display:none;">
  <div class="summary-card">
    <div class="summary-item">
      <div class="summary-number" id="totalCount">0</div>
      <div class="summary-label">追蹤股票</div>
    </div>
    <div class="summary-item">
      <div class="summary-number" style="color: #1D9E75;" id="strongBuyCount">0</div>
      <div class="summary-label">快速集中</div>
    </div>
    <div class="summary-item">
      <div class="summary-number" style="color: #378ADD;" id="buyCount">0</div>
      <div class="summary-label">持續增加</div>
    </div>
  </div>

  <div id="rankings"></div>
</div>

<div id="emptyState" class="empty-state" style="display:none;">
  <div class="empty-icon">📊</div>
  <div>暫無排行榜資料</div>
  <div style="margin-top: 8px; font-size: 13px;">請等待每週五更新</div>
</div>

<script>
function goBack() {
  window.location.href = 'index.html';
}

async function loadRankings() {
  try {
    const response = await fetch('data/ranking.json');
    const data = await response.json();
    
    if (!data || !data.rankings || !data.rankings.all) {
      showEmptyState();
      return;
    }
    
    displayRankings(data);
    
  } catch (error) {
    console.error('載入失敗:', error);
    showEmptyState();
  }
}

function displayRankings(data) {
  document.getElementById('updateTime').textContent = 
    `更新時間: ${data.update_time}`;
  
  document.getElementById('totalCount').textContent = data.summary.total;
  document.getElementById('strongBuyCount').textContent = data.summary.strong_buy;
  document.getElementById('buyCount').textContent = data.summary.buy;
  
  const container = document.getElementById('rankings');
  container.innerHTML = '';
  
  data.rankings.all.forEach((stock, index) => {
    const item = document.createElement('div');
    item.className = 'stock-item';
    item.onclick = () => viewStock(stock.stock_code);
    
    const holderChange = stock.trend.holder_change;
    const ratioChange = stock.trend.ratio_change;
    
    item.innerHTML = `
      <div class="stock-header">
        <div class="stock-rank">${index + 1}</div>
        <div class="stock-signal">${stock.signal.icon}</div>
        <div class="stock-info">
          <div class="stock-name">${stock.stock_name}</div>
          <div class="stock-code">${stock.stock_code}</div>
        </div>
      </div>
      <div class="stock-stats">
        <div class="stat-item">
          <div class="stat-label">大戶人數</div>
          <div class="stat-value ${holderChange >= 0 ? 'positive' : 'negative'}">
            ${holderChange >= 0 ? '+' : ''}${holderChange}人
          </div>
        </div>
        <div class="stat-item">
          <div class="stat-label">持股比例</div>
          <div class="stat-value">${stock.latest.big_ratio}%</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">比例變化</div>
          <div class="stat-value ${ratioChange >= 0 ? 'positive' : 'negative'}">
            ${ratioChange >= 0 ? '+' : ''}${ratioChange}%
          </div>
        </div>
      </div>
    `;
    
    container.appendChild(item);
  });
  
  document.getElementById('loading').style.display = 'none';
  document.getElementById('content').style.display = 'block';
}

function showEmptyState() {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('emptyState').style.display = 'block';
}

function viewStock(stockCode) {
  window.location.href = `index.html?stock=${stockCode}`;
}

window.addEventListener('load', loadRankings);
</script>
</body>
</html>
